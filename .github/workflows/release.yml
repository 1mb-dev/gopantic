name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: 1mb-dev/.github/.github/workflows/ci-go.yml@main
    with:
      go-versions: '["1.24", "1.26", "1.27"]'

  # A tag containing a hyphen is a release candidate: draft, so it never becomes Latest.
  create-release:
    needs: validate
    permissions:
      contents: write
    uses: 1mb-dev/.github/.github/workflows/release.yml@main
    with:
      draft: ${{ contains(github.ref_name, '-') }}
