name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A Dependabot auto-merge is pushed by GITHUB_TOKEN, which starts no push run, so main is
  # unverified until the next daily run. Dispatch verifies it on demand.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: 1mb-dev/.github/.github/workflows/ci-go.yml@main
    with:
      go-versions: '["1.24", "1.26", "1.27"]'

  # Reusable CI runs each test once, and validation caches are process-wide, so a bug that
  # needs a second parse only shows here.
  contract:
    name: Contract (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - run: make test-contract

  # Not required: `go test ./...` does not run the example mains.
  examples:
    name: Example Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - name: Run examples
        run: |
          # api_validation is an interactive server demo.
          for ex in quickstart yaml cache_demo pointers cross_field_validation; do
            (cd "examples/$ex" && go run main.go)
          done
      # Reusable CI stays in the root module, so this is the only check on benchmarks/.
      - name: Check comparison benchmarks
        working-directory: benchmarks
        run: |
          go mod tidy -diff
          go test -run='^$' -bench=. -benchtime=1x ./...
