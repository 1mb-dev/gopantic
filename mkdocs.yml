site_name: gopantic
site_url: https://1mb-dev.github.io/gopantic/
site_description: Parse, coerce and validate JSON and YAML in one call
repo_url: https://github.com/1mb-dev/gopantic
repo_name: 1mb-dev/gopantic

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
    - Validation: guide/validation.md
    - Coercion: guide/coercion.md
    - Caching: guide/caching.md
  - Reference:
    - API: reference/api.md
    - Types: reference/types.md
  - From encoding/json and validator: migration.md
  - Known limitations: known-limitations.md
  - How it works: architecture.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1mb-dev/gopantic

copyright: Copyright &copy; 2025-2026 - MIT License
